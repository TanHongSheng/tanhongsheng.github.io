<!DOCTYPE html>
<html lang="en">

  <meta charset="UTF-8" />

  <title>Animal Ladder Race</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f4ea;
      color: #222;
    }

    header {
      text-align: center;

    .panel {

      border: 2px solid #c89f4f;

<body>
  <header>
    <h1>Animal Ladder Race</h1>
    <p>Control the animal that finishes in <strong>3rd place</strong>!</p>
  </header>

  <main class="game-container">
    <!-- Ladder Section -->
    <section class="panel">
      <h2>Ladder Track</h2>

      <div class="ladder" id="ladder"></div>

      <div class="number-line">
        <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span>
        <span>5</span><span>6</span><span>7</span><span>8</span><span>9</span>
        <span>10</span><span>11</span><span>12</span>
      </div>
    </section>

    <!-- Control Section -->
    <section class="panel">
      <h2>Coin Area</h2>

      <div class="status-box" id="statusBox"></div>

      <div class="animal-buttons">
        <button onclick="placeCoin('cat')">🐱 Cat</button>
        <button onclick="placeCoin('dog')">🐶 Dog</button>
        <button onclick="placeCoin('tiger')">🐯 Tiger</button>
        <button onclick="placeCoin('lion')">🦁 Lion</button>
      </div>

      <h2>Coins This Round</h2>
      <table>
        <thead>
          <tr>
            <th>Animal</th>
            <th>Coins</th>
          </tr>
        </thead>
        <tbody id="coinTable"></tbody>
      </table>

      <h2>Current Ranking</h2>
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Animal</th>
            <th>Position</th>
            <th>Player</th>
          </tr>
        </thead>
        <tbody id="rankingTable"></tbody>
      </table>

      <div class="winner" id="winnerBox"></div>

      <button class="reset-button" onclick="resetGame()">Reset Game</button>
    </section>

    <!-- Game Log -->
    <section class="panel" style="grid-column: 1 / -1;">
      <h2>Game Log</h2>
      <div class="log" id="gameLog"></div>
    </section>
  </main>

  <script>
    const finishLine = 12;

    const animals = {
      cat: {
        name: "Cat",
        emoji: "🐱",
        steps: 2,
        owner: "Player A",
        position: 0
      },
      dog: {
        name: "Dog",
        emoji: "🐶",
        steps: 3,
        owner: "Player B",
        position: 0
      },
      tiger: {
        name: "Tiger",
        emoji: "🐯",
        steps: 4,
        owner: "Player B",
        position: 0
      },
      lion: {
        name: "Lion",
        emoji: "🦁",
        steps: 6,
        owner: "Player A",
        position: 0
      }
    };

    let roundNumber = 1;
    let moveNumber = 0;
    let coins = {};
    let gameOver = false;

    function resetCoins() {
      coins = {
        cat: 0,
        dog: 0,
        tiger: 0,
        lion: 0
      };
    }

    function getTurnOrder() {
      if (roundNumber % 2 === 1) {
        return ["Player A", "Player B", "Player A", "Player B"];
      } else {
        return ["Player B", "Player A", "Player B", "Player A"];
      }
    }

    function getCurrentPlayer() {
      return getTurnOrder()[moveNumber];
    }

    function createLadder() {
      const ladder = document.getElementById("ladder");
      ladder.innerHTML = "";

      Object.keys(animals).forEach((key) => {
        const animal = animals[key];

        const row = document.createElement("div");
        row.className = "track-row";

        const label = document.createElement("div");
        label.className = "animal-label";
        label.textContent = `${animal.emoji} ${animal.name}`;

        const track = document.createElement("div");
        track.className = "track";

        const finish = document.createElement("div");
        finish.className = "finish-line";

        const piece = document.createElement("div");
        piece.className = "animal-piece";
        piece.id = `${key}-piece`;
        piece.textContent = animal.emoji;

        track.appendChild(finish);
        track.appendChild(piece);
        row.appendChild(label);
        row.appendChild(track);
        ladder.appendChild(row);
      });
    }

    function updateAnimalPositions() {
      Object.keys(animals).forEach((key) => {
        const animal = animals[key];
        const piece = document.getElementById(`${key}-piece`);
        const safePosition = Math.min(animal.position, finishLine);
        const percentage = (safePosition / finishLine) * 100;
        piece.style.left = `${percentage}%`;
      });
    }

    function getRanking() {
      return Object.entries(animals)
        .map(([key, animal]) => ({ key, ...animal }))
        .sort((a, b) => {
          if (b.position !== a.position) {
            return b.position - a.position;
          }

          // If tied in position, slower animal ranks higher.
          return a.steps - b.steps;
        });
    }

    function updateStatus() {
      const statusBox = document.getElementById("statusBox");

      if (gameOver) {
        statusBox.innerHTML = "Game over. Press <strong>Reset Game</strong> to play again.";
        return;
      }

      statusBox.innerHTML = `
        <strong>Round:</strong> ${roundNumber}<br>
        <strong>Current Player:</strong> ${getCurrentPlayer()}<br>
        <strong>Goal:</strong> Own the 3rd-place animal when the game ends.
      `;
    }

    function updateCoinTable() {
      const coinTable = document.getElementById("coinTable");
      coinTable.innerHTML = "";

      Object.keys(animals).forEach((key) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${animals[key].emoji} ${animals[key].name}</td>
          <td>${coins[key]}</td>
        `;
        coinTable.appendChild(row);
      });
    }

    function updateRankingTable() {
      const rankingTable = document.getElementById("rankingTable");
      rankingTable.innerHTML = "";

      const ranking = getRanking();

      ranking.forEach((animal, index) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${index + 1}</td>
          <td>${animal.emoji} ${animal.name}</td>
          <td>${animal.position}</td>
          <td>${animal.owner}</td>
        `;
        rankingTable.appendChild(row);
      });
    }

    function addLog(message) {
      const gameLog = document.getElementById("gameLog");
      const line = document.createElement("div");
      line.textContent = message;
      gameLog.prepend(line);
    }

    function placeCoin(animalKey) {
      if (gameOver) return;

      const currentPlayer = getCurrentPlayer();
      coins[animalKey] += 1;

      addLog(`${currentPlayer} placed 1 coin on ${animals[animalKey].name}.`);

      moveNumber += 1;

      if (moveNumber >= 4) {
        resolveRound();
      }

      updateAll();
    }

    function resolveRound() {
      const maxCoins = Math.max(...Object.values(coins));
      const tiedAnimals = Object.keys(coins).filter(key => coins[key] === maxCoins);

      let movingAnimalKey = null;

      if (tiedAnimals.length === 1) {
        movingAnimalKey = tiedAnimals[0];
      } else {
        movingAnimalKey = breakCoinTie(tiedAnimals);
      }

      if (movingAnimalKey === null) {
        addLog(`Round ${roundNumber}: tied animals are also on the same position. No animal moves.`);
      } else {
        const animal = animals[movingAnimalKey];
        animal.position += animal.steps;

        addLog(
          `Round ${roundNumber}: ${animal.name} moves ${animal.steps} steps to position ${animal.position}.`
        );

        if (animal.position >= finishLine) {
          endGame(animal.name);
          return;
        }
      }

      roundNumber += 1;
      moveNumber = 0;
      resetCoins();
    }

    function breakCoinTie(tiedAnimals) {
      const lowestPosition = Math.min(
        ...tiedAnimals.map(key => animals[key].position)
      );

      const furthestBehind = tiedAnimals.filter(
        key => animals[key].position === lowestPosition
      );

      if (furthestBehind.length === 1) {
        return furthestBehind[0];
      }

      // If tied animals are also on the same position, no animal moves.
      return null;
    }

    function endGame(finishingAnimalName) {
      gameOver = true;

      const ranking = getRanking();
      const thirdPlaceAnimal = ranking[2];
      const winner = thirdPlaceAnimal.owner;

      addLog(`${finishingAnimalName} reached position 12. The game ends.`);
      addLog(`${thirdPlaceAnimal.name} is in 3rd place. ${winner} wins!`);

      const winnerBox = document.getElementById("winnerBox");
      winnerBox.style.display = "block";
      winnerBox.innerHTML = `
        ${finishingAnimalName} reached the finish line!<br>
        The 3rd-place animal is ${thirdPlaceAnimal.emoji} ${thirdPlaceAnimal.name}.<br>
        <strong>${winner} wins!</strong>
      `;
    }

    function updateAll() {
      updateAnimalPositions();
      updateStatus();
      updateCoinTable();
      updateRankingTable();
    }

    function resetGame() {
      Object.keys(animals).forEach((key) => {
        animals[key].position = 0;
      });

      roundNumber = 1;
      moveNumber = 0;
      gameOver = false;
      resetCoins();

      document.getElementById("winnerBox").style.display = "none";
      document.getElementById("winnerBox").innerHTML = "";
      document.getElementById("gameLog").innerHTML = "";

      addLog("New game started.");

      updateAll();
    }

    createLadder();
    resetCoins();
    resetGame();
  </script>
</body>
</html>
